name: Build and Publish Package

# Tags only. This used to also fire on every push to main, which published a
# throwaway `<version>-<timestamp>` prerelease on each merge - one real release
# and one junk version per bump, accumulating in the registry forever. Cutting a
# release is now exactly one action: push a `v*` tag.
#
# workflow_dispatch is kept for deliberate off-tag builds (e.g. handing someone a
# prerelease to test); run from a branch and the timestamped version below is
# what gets published, which is the only place that path is still wanted.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release # must match the npm trusted-publisher registration
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ghosttypes'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Set version
        id: set_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # If this is a tag push, use the tag version
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          else
            # If this is not a tag push, use the current version and add timestamp
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            VERSION="${CURRENT_VERSION}-${TIMESTAMP}"
          fi
          echo "Using version: $VERSION"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [[ "$CURRENT_VERSION" != "$VERSION" ]]; then
            pnpm version $VERSION --no-git-tag-version
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade npm for trusted publishing (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish to npm (public, trusted publishing)
        run: npm publish --registry=https://registry.npmjs.org/

      - name: Report error details if failed
        if: failure()
        run: |
          echo "::error::Package publish failed. Please check authentication and configuration."
          echo "::group::PNPM Config"
          pnpm config list
          echo "::endgroup::"
          echo "::group::Repository Info"
          echo "Owner: ${{ github.repository_owner }}"
          echo "Repo: ${{ github.repository }}"
          echo "::endgroup::"
